[package]
name = "git-edge-spike"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8.5" }
worker-macros = "0.8.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bstr = { version = "1.12", default-features = false, features = ["std"] }

gix-hash        = { version = "0.26.2", default-features = false, features = ["sha1"] }
gix-object      = { version = "0.64.1", default-features = false, features = ["sha1"] }
gix-packetline  = { version = "0.22.2", default-features = false, features = ["blocking-io"] }
gix-pack        = { version = "0.74.2", default-features = false, features = ["sha1", "streaming-input", "wasm"] }
gix-traverse    = { version = "0.61.0", default-features = false, features = ["sha1"] }
gix-zlib        = { version = "0.1.0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"   # NOT `true`: --strip-all drops the target_features section and wasm-bindgen then fails with "externref table required for catch wrappers"
