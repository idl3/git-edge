[package]
name = "git-edge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.5"
worker-macros = "0.8.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bstr = { version = "1.12", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
js-sys = "0.3"
wasm-streams = "0.6"
web-sys = { version = "0.3", default-features = false, features = ["Crypto", "CompressionFormat", "DecompressionStream", "ReadableStream", "WritableStream", "ReadableWritablePair"] }

gix-hash        = { version = "0.26.2", default-features = false, features = ["sha1", "sha256", "serde"] }
gix-object      = { version = "0.64.1", default-features = false, features = ["sha1", "sha256"] }
gix-packetline  = { version = "0.22.2", default-features = false, features = ["blocking-io"] }
gix-pack        = { version = "0.74.2", default-features = false, features = ["sha1", "sha256", "streaming-input", "wasm"] }
gix-traverse    = { version = "0.61.0", default-features = false, features = ["sha1", "sha256"] }
gix-zlib        = { version = "0.1.0", default-features = false }
gix-validate    = { version = "0.11.4", default-features = false }
serde_bytes = "0.11"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
